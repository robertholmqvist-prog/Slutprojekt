<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Väderapp</title>
    <link rel="stylesheet" href="/Style/style.css" />
    <link rel="icon" href="bilder/väder_icon.png" />
    <script
      src="https://kit.fontawesome.com/8005aba767.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <nav>
    <ul class="menu">
      <li class="menu-item">
        <a href="källor.html">Källor</a>
      </li>
      <li class="menu-item">
        <a href="index.html">Hem</a>
      </li>
      <li class="menu-item">
        <a href="om-oss.html">Om oss</a>
      </li>
      <li class="menu-item" id="button">
        <a href="#sökskärm">sök</a>
      </li>
    </ul>
  </nav>
  <body>
    <header id="sökskärm" alt="bild på berg">
      <h1>Väderapp</h1>
      <h2>Välkommen till vår Väderapplikation!</h2>
      <div id="search_container">
        <input type="text" id="search" placeholder="sök plats..." />
        <button type="submit" onclick="sökplats()">Sök</button>
      </div>
    </header>
    <main>
      <div id="resultat">
        <div id="resultat_rubrik"></div>
        <div id="resultat_innehåll">
          <table id="timtabell">
            <tr>
              <th>Tid</th>
              <th>Data</th>
            </tr>
            <div id="timtryck">
              <button class="timknappar" onclick="fyllTimtabell('temp')">
                Temperatur
                <i class="fa-solid fa-temperature-high"></i>
              </button>
              <button class="timknappar" onclick="fyllTimtabell('vind')">
                Vind
                <i class="fa-solid fa-wind"></i>
              </button>
              <button class="timknappar" onclick="fyllTimtabell('regn')">
                Regn
                <i class="fa-solid fa-cloud-showers-heavy"></i>
              </button>
            </div>
          </table>
          <table id="tabell">
            <tr>
              <th>Dag</th>
              <th>H/L</th>
              <th>Regn</th>
            </tr>
          </table>
        </div>
      </div>
    </main>
    <footer id="fot">
      <p>&copy; 2026 Väderapp. Alla rättigheter förbehållna Till Robernator.</p>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
